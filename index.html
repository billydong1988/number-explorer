<style>

.mode-tabs{display:flex;gap:10px;margin-bottom:12px}.mode-tab{flex:1;padding:14px 10px;border:2px solid #b9d6ea;border-radius:18px;background:#eff7ff;color:#315d87;font-weight:900;font-size:clamp(17px,2.3vw,23px)}.mode-tab.active{background:#f9ba4d;border-color:#e49a2d;color:#543c14;box-shadow:0 4px 0 #c58427}.mode-tab:active{transform:translateY(2px)}

.mole-prompt{font-size:clamp(16px,2vw,21px);font-weight:900;color:#617a4b;margin:6px 0 0}.mole-mode .character{display:none}.mole-mode .math{font-size:clamp(38px,6vw,70px);margin:4px 0}.mole-mode .progress{margin-bottom:12px}.mole-mode .feedback{min-height:42px}.mole-mode .aside .keypad{margin:14px auto;max-width:100%}.mole-mode .aside .key{min-height:clamp(48px,7vh,65px)}.mole-mode .key{min-height:clamp(48px,6.4vh,70px)}
@media(max-width:850px){.burrow{height:clamp(78px,19vw,108px)}.mole{font-size:clamp(48px,12vw,68px)}.burrows{gap:8px}.mode-tab{padding:11px 8px}.mole-mode .math{font-size:clamp(34px,8vw,60px)}.mole-mode .key{min-height:54px}}
@media(max-height:760px) and (min-width:851px){.mole-mode .burrow{height:76px}.mole-mode .mole{font-size:53px}.mole-mode .key{min-height:46px}.mole-mode .burrows{margin-top:6px}.mole-mode .panel{padding:13px}.mole-mode .math{font-size:52px}.mole-mode .levels{margin-bottom:8px}}

@media(max-width:850px){main{grid-template-columns:1fr}.aside{order:2}.shell{padding:12px}header{margin-bottom:10px}.panel{border-radius:22px;padding:16px}.progress{margin-bottom:14px}.character{margin:0}.feedback{min-height:46px}.keypad{max-width:100%}.aside h2{font-size:20px}.streak{margin-top:12px}}
@media(max-height:720px) and (min-width:761px){.panel{padding:16px}.character{font-size:42px}.progress{margin:6px 0 10px}.math{font-size:60px}.key{min-height:48px}.feedback{min-height:38px}.levels{margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
@media(max-width:600px){.shell{padding:8px;padding-top:max(8px,env(safe-area-inset-top))}.panel{padding:10px;border-radius:18px}header{margin-bottom:6px}.logo{font-size:26px}h1{font-size:20px}.sub{font-size:11px;margin-top:2px}.score{padding:8px;font-size:16px;border-radius:14px}.mode-tabs{gap:6px;margin-bottom:7px}.mode-tab{font-size:15px;padding:9px 5px}.levels{gap:5px;margin-bottom:8px}.level{font-size:13px;min-width:0;padding:8px 4px}.mole-settings{font-size:13px;margin-bottom:7px}.time-choice{padding:6px 9px;font-size:13px}.topline{font-size:13px}.progress{height:9px;margin:6px 0}.mole-mode .math{font-size:clamp(32px,9vw,48px);margin:0}.math{font-size:clamp(34px,10vw,54px);margin:2px 0}.mole-stage{margin:0}.timer-row{font-size:13px}.timer-number{font-size:18px}.timer-track{height:10px}.burrows{gap:5px;margin-top:5px}.burrow{height:clamp(58px,17vw,86px);border-radius:14px}.mole{font-size:clamp(37px,10vw,54px)}.mole-prompt{font-size:13px;margin:2px}.prompt{font-size:14px}.feedback{font-size:14px;min-height:28px}.keypad{gap:6px}.key,.mole-mode .key{min-height:clamp(43px,6.3dvh,58px);font-size:24px;border-radius:12px}.key.ok{font-size:18px}.aside{padding:10px}.aside h2{font-size:16px}.aside p{font-size:13px;line-height:1.3}.hint-btn,.restart{padding:9px;margin-top:6px;font-size:14px}.streak{padding:9px;font-size:14px;margin-top:8px}main{gap:8px}}
@media(max-width:600px) and (max-height:750px){.burrow{height:54px}.key,.mole-mode .key{min-height:40px}.mole-prompt{display:none}.progress{margin:3px 0}.panel{padding:8px}.levels{margin-bottom:5px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo">🚀</div><div><h1>數字探險隊</h1><div class="sub">每天 10 題，二位數加減法闖關！</div></div></div><div class="score" aria-live="polite"><span id="scoreIcon">⭐</span> <span id="score">0</span></div></header>
<main>
<section class="panel" id="game">
<div class="mode-tabs" role="group" aria-label="遊戲模式"><button class="mode-tab active" data-mode="classic">🧮 算術闖關</button><button class="mode-tab" data-mode="mole">🐹 算術打地鼠</button></div>
<div class="levels" role="group" aria-label="選擇難度"><button class="level active" data-level="easy">🌱 暖身</button><button class="level" data-level="medium">🔥 進階</button><button class="level" data-level="hard">🏆 挑戰</button></div>
<div class="mole-settings" id="moleSettings"><span>⏱️ 每隻地鼠的時間</span><div class="time-choices" role="group" aria-label="地鼠時間"><button class="time-choice" data-seconds="10">10 秒</button><button class="time-choice active" data-seconds="15">15 秒</button><button class="time-choice" data-seconds="20">20 秒</button></div></div>
<div class="topline"><span id="count">第 1 / 10 題</span><span id="levelDescription">不進位・不退位</span></div><div class="progress"><div class="fill" id="fill"></div></div>
<div id="questionArea"><div class="mole-stage" id="moleStage"><div class="timer-row"><span>快算！地鼠要逃走了！</span><span class="timer-number" id="timerNumber">15.0 秒</span></div><div class="timer-track"><div class="timer-fill" id="timerFill"></div></div><div class="burrows" id="burrows"><div class="burrow"><span class="mole">🐹</span><span class="mole-burst">💥</span></div><div class="burrow"><span class="mole">🐹</span><span class="mole-burst">💥</span></div><div class="burrow"><span class="mole">🐹</span><span class="mole-burst">💥</span></div></div><div class="mole-prompt" id="molePrompt">算對答案，就能打到地鼠！</div></div><div class="character" id="character">🦊</div><div class="prompt" id="questionPrompt">幫小狐狸算出答案！</div><div class="math"><span id="a">23</span><span class="op" id="op">＋</span><span id="b">14</span><span>=</span><span class="answer empty" id="answer">?</span></div><div class="feedback" id="feedback" aria-live="polite">點下面的數字輸入答案（按 Enter 可確認）</div>
<div class="keypad" id="keypad" aria-label="數字鍵盤"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key delete" data-key="del">⌫ 刪除</button><button class="key" data-key="0">0</button><button class="key ok" id="submit" data-key="ok">確認 ✓</button></div></div>
<div class="finish" id="finish"><div class="trophy" id="finishTrophy">🏆</div><h2 id="finishTitle">探險成功！</h2><div class="summary" id="summary"></div><button id="again">再玩 10 題 🎉</button><div class="history" id="best"></div></div>
</section>
<aside class="panel aside"><h2>🧠 算術小老師</h2><p id="instruction">先看個位數，再看十位數。慢慢算，不用趕！</p><button class="hint-btn" id="hintButton">💡 我要提示</button><div class="hint" id="hint"></div><div class="streak" id="streak">🌟 連續答對：0 題</div><button class="restart" id="restart">🔄 重新開始</button><p class="note">🐹 打地鼠模式：每隻地鼠限時 10、15 或 20 秒，答對就打到一隻，超時會逃走。可用 iPad 觸控鍵盤，或用實體鍵盤的數字鍵和 Enter。切換遊戲模式或難度會重新開始。遊戲不需要網路。</p></aside>
</main></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const state={mode:'classic',level:'easy',seconds:15,qs:[],index:0,answer:'',score:0,streak:0,bestStreak:0,firstTry:0,mistakes:0,usedHint:false,locked:false,hits:0,misses:0,remaining:15000,lastTick:0,timerId:null,nextId:null,molePos:-1};
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const descriptions={easy:'不進位・不退位',medium:'進位加法・借位減法',hard:'加減混合大挑戰'};
function makeQ(level){let a,b,op;for(let i=0;i<1000;i++){op=Math.random()<.5?'+':'-';a=rand(12,99);b=rand(11,89);if(op==='+'&&a+b>99)continue;if(op==='-'&&a<=b)continue;const u=a%10,v=b%10;if(level==='easy'&&((op==='+'&&u+v>=10)||(op==='-'&&u<v)))continue;if(level==='medium'&&((op==='+'&&u+v<10)||(op==='-'&&u>=v)))continue;return {a,b,op};}return {a:23,b:14,op:'+'};}
function stopTimers(){if(state.timerId!==null){clearInterval(state.timerId);state.timerId=null;}if(state.nextId!==null){clearTimeout(state.nextId);state.nextId=null;}}
function newRound(level=state.level,mode=state.mode){stopTimers();Object.assign(state,{mode,level,qs:Array.from({length:10},()=>makeQ(level)),index:0,answer:'',score:0,streak:0,bestStreak:0,firstTry:0,mistakes:0,usedHint:false,locked:false,hits:0,misses:0,molePos:-1});document.body.classList.toggle('mole-mode',mode==='mole');document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b.dataset.level===level));document.querySelectorAll('.time-choice').forEach(b=>b.classList.toggle('active',Number(b.dataset.seconds)===state.seconds));$('moleSettings').classList.toggle('show',mode==='mole');$('moleStage').classList.toggle('show',mode==='mole');$('scoreIcon').textContent=mode==='mole'?'🐹':'⭐';$('instruction').textContent=mode==='mole'?'每隻地鼠只有 '+state.seconds+' 秒！算對答案，按確認就能打到牠。':'先看個位數，再看十位數。慢慢算，不用趕！';$('hintButton').style.display=mode==='mole'?'none':'';arrangeKeypad();$('questionPrompt').textContent=mode==='mole'?'算出答案，打地鼠！':'幫小狐狸算出答案！';$('questionArea').style.display='';$('finish').style.display='none';$('hint').classList.remove('show');$('hintButton').textContent='💡 我要提示';render();if(mode==='mole')startMole();}
function current(){return state.qs[state.index];}function result(q){return q.op==='+'?q.a+q.b:q.a-q.b;}
function render(){const q=current();if(!q)return;$('a').textContent=q.a;$('b').textContent=q.b;$('op').textContent=q.op==='+'?'＋':'−';$('count').textContent=`第 ${state.index+1} / 10 ${state.mode==='mole'?'隻地鼠':'題'}`;$('levelDescription').textContent=descriptions[state.level];$('fill').style.width=`${state.index*10}%`;$('score').textContent=state.mode==='mole'?state.hits:state.score;$('answer').textContent=state.answer||'?';$('answer').classList.toggle('empty',!state.answer);$('character').textContent=['🦊','🐼','🐯','🐸','🐨','🦁','🐵','🐰','🐻','🦄'][state.index];$('feedback').className='feedback';$('feedback').textContent=state.mode==='mole'?'快輸入答案，按 Enter 打地鼠！':'點數字輸入答案，按 Enter 確認';$('streak').textContent=state.mode==='mole'?`🐹 打到 ${state.hits} 隻・逃走 ${state.misses} 隻`:`🌟 連續答對：${state.streak} 題`;$('submit').textContent='確認 ✓';$('submit').classList.remove('next');$('submit').classList.add('ok');}
function sound(good){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext();const now=ctx.currentTime;const notes=good?[523,659,784]:[220,196];notes.forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,now+i*.12);g.gain.exponentialRampToValueAtTime(.09,now+i*.12+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.12+.16);o.start(now+i*.12);o.stop(now+i*.12+.17)});setTimeout(()=>ctx.close().catch(()=>{}),650);}catch(e){}}
function showTimer(){const sec=Math.max(0,state.remaining)/1000;$('timerNumber').textContent=sec.toFixed(1)+' 秒';$('timerFill').style.width=`${Math.max(0,100*state.remaining/(state.seconds*1000))}%`;$('timerFill').className='timer-fill'+(sec<=4?' danger':sec<=7?' warning':'');}
function startMole(){stopTimers();state.remaining=state.seconds*1000;state.lastTick=performance.now();state.molePos=rand(0,2);document.querySelectorAll('.burrow').forEach((b,i)=>{b.className='burrow'+(i===state.molePos?' active':'');});$('molePrompt').textContent='算對答案，就能打到地鼠！';showTimer();state.timerId=setInterval(()=>{if(document.hidden||state.mode!=='mole'||state.locked||state.index>=10){state.lastTick=performance.now();return;}const now=performance.now();state.remaining=Math.max(0,state.remaining-(now-state.lastTick));state.lastTick=now;showTimer();if(state.remaining<=0)escapeMole();},60);}
function press(k){if(state.index>=10)return;if(state.locked){if(k==='ok'&&state.mode==='classic')advance();return;}if(k==='del'){state.answer=state.answer.slice(0,-1);}else if(k==='ok'){check();return;}else if(/^\d$/.test(k)&&state.answer.length<3){state.answer+=k;}else return;$('answer').textContent=state.answer||'?';$('answer').classList.toggle('empty',!state.answer);}
function check(){if(!state.answer){$('feedback').textContent='先選一個答案喔！';return;}const q=current();if(Number(state.answer)===result(q)){state.locked=true;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);if(state.mode==='mole'){stopTimers();state.hits++;$('score').textContent=state.hits;$('streak').textContent=`🐹 打到 ${state.hits} 隻・逃走 ${state.misses} 隻`;document.querySelectorAll('.burrow')[state.molePos].className='burrow hit';$('feedback').className='feedback good';$('feedback').textContent='💥 打中了！好棒！';$('molePrompt').textContent='地鼠被你打到了！';sound(true);state.nextId=setTimeout(advance,850);}else{const earned=state.mistakes===0&&!state.usedHint?10:5;state.score+=earned;if(earned===10)state.firstTry++;$('score').textContent=state.score;$('streak').textContent=`🌟 連續答對：${state.streak} 題`;$('feedback').className='feedback good';$('feedback').textContent=`🎉 答對了！+${earned} 顆星星！`;$('submit').textContent=state.index===9?'看成績 🏆':'下一題 ➜';$('submit').classList.remove('ok');$('submit').classList.add('next');sound(true);}}else{state.mistakes++;state.streak=0;$('streak').textContent=state.mode==='mole'?`🐹 打到 ${state.hits} 隻・逃走 ${state.misses} 隻`:'🌟 連續答對：0 題';$('feedback').className='feedback bad';$('feedback').textContent=state.mode==='mole'?'還沒打中！快再算一次！':'再試一次！想想個位數怎麼算 💪';state.answer='';$('answer').textContent='?';$('answer').classList.add('empty');sound(false);}}
function escapeMole(){if(state.locked)return;state.locked=true;stopTimers();state.misses++;state.streak=0;document.querySelectorAll('.burrow')[state.molePos].className='burrow escape';$('streak').textContent=`🐹 打到 ${state.hits} 隻・逃走 ${state.misses} 隻`;$('feedback').className='feedback bad';$('feedback').textContent=`⌛ 地鼠逃走了！正確答案是 ${result(current())}`;$('molePrompt').textContent='沒關係，下一隻再加油！';state.nextId=setTimeout(advance,1250);}
function advance(){stopTimers();state.index++;if(state.index>=10){finish();return;}state.answer='';state.mistakes=0;state.usedHint=false;state.locked=false;$('hint').classList.remove('show');$('hintButton').textContent='💡 我要提示';render();if(state.mode==='mole')startMole();}
function hintText(q){const au=q.a%10,bu=q.b%10,at=Math.floor(q.a/10),bt=Math.floor(q.b/10);if(q.op==='+'){return au+bu>=10?`先算個位：${au}＋${bu}＝${au+bu}。寫下 ${(au+bu)%10}，向十位進 1。再算十位：${at}＋${bt}＋1。`:`先算個位：${au}＋${bu}。再算十位：${at}＋${bt}。最後把十位和個位合起來。`;}return au<bu?`個位 ${au} 不夠減 ${bu}，向十位借 1 個十。先算 ${au+10}－${bu}，再算十位 ${at-1}－${bt}。`:`先算個位：${au}－${bu}。再算十位：${at}－${bt}。最後把十位和個位合起來。`;}
function finish(){stopTimers();$('questionArea').style.display='none';$('finish').style.display='block';$('fill').style.width='100%';$('count').textContent='10 / 10 '+(state.mode==='mole'?'隻地鼠':'題')+'完成';let key,best;if(state.mode==='mole'){$('finishTrophy').textContent=state.hits>=8?'🏆':'🐹';$('finishTitle').textContent='打地鼠挑戰完成！';$('summary').innerHTML=`🐹 <strong>打到 ${state.hits} 隻地鼠</strong><br>💨 逃走 ${state.misses} 隻<br>⏱️ 每隻限時 ${state.seconds} 秒`;key=`number-explorer-mole-${state.level}-${state.seconds}`;best=state.hits;}else{$('finishTrophy').textContent='🏆';$('finishTitle').textContent='探險成功！';$('summary').innerHTML=`⭐ <strong>${state.score} 顆星星</strong><br>第一次就答對：${state.firstTry} 題<br>最長連對：${state.bestStreak} 題`;key=`number-explorer-best-${state.level}`;best=state.score;}try{best=Math.max(Number(localStorage.getItem(key))||0,best);localStorage.setItem(key,String(best));}catch(e){}$('best').textContent=state.mode==='mole'?`這個難度和時間的最高紀錄：打到 ${best} 隻`:`這個難度的最高紀錄：${best} 顆星星`;}
$('keypad').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)press(b.dataset.key)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.code==='NumpadEnter'){e.preventDefault();if(e.repeat)return;press('ok');return;}if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(/^\d$/.test(e.key)){e.preventDefault();press(e.key);}else if(e.key==='Backspace'){e.preventDefault();press('del');}});
document.querySelectorAll('.mode-tab').forEach(b=>b.addEventListener('click',()=>newRound(state.level,b.dataset.mode)));
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>newRound(b.dataset.level)));
document.querySelectorAll('.time-choice').forEach(b=>b.addEventListener('click',()=>{state.seconds=Number(b.dataset.seconds);newRound();}));
$('hintButton').addEventListener('click',()=>{if(state.locked||state.mode==='mole')return;const show=!$('hint').classList.contains('show');$('hint').classList.toggle('show',show);$('hintButton').textContent=show?'收起提示':'💡 我要提示';if(show){state.usedHint=true;$('hint').textContent=hintText(current());}});
$('restart').addEventListener('click',()=>newRound());$('again').addEventListener('click',()=>newRound());
document.addEventListener('visibilitychange',()=>{state.lastTick=performance.now();});
function arrangeKeypad(){if(state.mode==='mole'&&window.innerWidth>850){$('instruction').after($('keypad'));}else{$('feedback').after($('keypad'));}}
window.addEventListener('resize',arrangeKeypad);
newRound();
})();
</script>
</body></html>
